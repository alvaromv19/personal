<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IA DJ Master Console</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
    :root {
        --bg: #050507;
        --card-bg: #111116;
        --purple: #bc13fe;
        --turquoise: #00f2ff;
        --text: #ffffff;
        --gray: #444;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Inter', 'Segoe UI', sans-serif;
        display: grid;
        grid-template-columns: 1fr 380px;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    /* --- SIDEBAR COLA --- */
    .queue-panel {
        background: #0a0a0f;
        border-left: 2px solid #1a1a25;
        padding: 20px;
        display: flex;
        flex-direction: column;
    }

    .queue-header {
        color: var(--purple);
        text-transform: uppercase;
        letter-spacing: 3px;
        font-size: 0.9rem;
        margin-bottom: 20px;
        border-bottom: 1px solid #222;
        padding-bottom: 10px;
    }

    #queue-list {
        flex-grow: 1;
        overflow-y: auto;
    }

    .queue-item {
        background: var(--card-bg);
        margin-bottom: 12px;
        padding: 12px;
        border-radius: 8px;
        border-left: 3px solid var(--gray);
        transition: 0.3s;
    }

    .queue-item.active {
        border-left-color: var(--turquoise);
        box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
    }

    /* --- CONSOLA CENTRAL --- */
    .main-panel {
        display: flex;
        flex-direction: column;
        padding: 30px;
        gap: 30px;
    }

    .decks-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        flex-grow: 1;
    }

    .deck {
        background: var(--card-bg);
        border: 1px solid #222;
        border-radius: 20px;
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
    }

    .deck.playing {
        border-color: var(--purple);
        box-shadow: 0 0 30px rgba(188, 19, 254, 0.15);
    }

    /* Vinilo Animado */
    .vinyl {
        width: 180px;
        height: 180px;
        background: radial-gradient(circle, #222 0%, #000 70%);
        border-radius: 50%;
        border: 5px solid #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .vinyl::after {
        content: '';
        width: 40px;
        height: 40px;
        background: var(--purple);
        border-radius: 50%;
    }

    .playing .vinyl {
        animation: rotate 3s linear infinite;
        border-color: var(--turquoise);
    }

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .track-info { text-align: center; margin-top: 20px; }
    .track-title { color: var(--turquoise); font-weight: bold; font-size: 1.2rem; min-height: 1.5em; }
    .track-status { font-size: 0.7rem; text-transform: uppercase; color: var(--purple); letter-spacing: 2px; }

    /* Mezclador Central (Controles) */
    .mixer-controls {
        background: #0f0f14;
        padding: 20px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        border: 1px solid #222;
    }

    .crossfader-container {
        width: 300px;
        height: 10px;
        background: #222;
        border-radius: 5px;
        position: relative;
    }

    .crossfader-knob {
        width: 40px;
        height: 25px;
        background: var(--turquoise);
        position: absolute;
        top: -7px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 4px;
        box-shadow: 0 0 10px var(--turquoise);
    }

    button.pro-btn {
        background: transparent;
        border: 2px solid var(--purple);
        color: var(--purple);
        padding: 12px 25px;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button.pro-btn:hover { background: var(--purple); color: white; box-shadow: 0 0 20px var(--purple); }

    .search-box {
        width: 100%;
        display: flex;
        gap: 10px;
    }

    .search-box input {
        flex-grow: 1;
        background: #1a1a25;
        border: 1px solid #333;
        padding: 15px;
        color: white;
        border-radius: 8px;
    }
</style>

<body>
    <div class="main-panel">
        <div class="decks-container">
            <div id="deck-1" class="deck">
                <div class="track-status">Deck A</div>
                <div class="vinyl"></div>
                <div class="track-info">
                    <div id="title-1" class="track-title">Standby</div>
                </div>
            </div>

            <div id="deck-2" class="deck">
                <div class="track-status">Deck B</div>
                <div class="vinyl"></div>
                <div class="track-info">
                    <div id="title-2" class="track-title">Standby</div>
                </div>
            </div>
        </div>

        <div class="mixer-controls">
            <button class="pro-btn" onclick="togglePause()" id="btn-pause">PAUSE / PLAY</button>
            <div class="crossfader-container">
                <div id="fader-knob" class="crossfader-knob"></div>
            </div>
            <button class="pro-btn" style="border-color: var(--turquoise); color: var(--turquoise);" onclick="skipTrack()">NEXT SKIP</button>
        </div>

        <div class="search-box">
            <input type="text" id="manual-search" placeholder="Buscar canción manual en la base de datos...">
            <button class="pro-btn" onclick="addManual()">ADD QUEUE</button>
        </div>
    </div>

    <div class="queue-panel">
        <div class="queue-header">Playlist en vivo</div>
        <div id="queue-list"></div>
    </div>
</body>

    <script>

        // Función para actualizar la visual de los Decks
function updateDeckVisuals() {
    const d1 = document.getElementById('deck-1');
    const d2 = document.getElementById('deck-2');
    const knob = document.getElementById('fader-knob');

    if (active === 1) {
        d1.classList.add('playing');
        d2.classList.remove('playing');
        knob.style.left = "20%"; // Mueve el fader a la izquierda
        knob.style.background = "var(--turquoise)";
    } else {
        d2.classList.add('playing');
        d1.classList.remove('playing');
        knob.style.left = "80%"; // Mueve el fader a la derecha
        knob.style.background = "var(--purple)";
    }
}

// Llama a updateDeckVisuals() dentro de tu función startCrossfade() 
// justo cuando cambias el valor de 'active'.
        
        // ⚠️ REEMPLAZA ESTO con tus datos reales de Supabase
        const _supabase = supabase.createClient('https://krwojvaqdcmgqaposwco.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtyd29qdmFxZGNtZ3FhcG9zd2NvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODI4NTA2OCwiZXhwIjoyMDkzODYxMDY4fQ.IS3kMLP_UzDdTYat4ChTs9j-XJD7c9fB_bdjob4tfPM');
        
        let audio1 = new Audio();
        let audio2 = new Audio();
        let active = 1;
        let isPaused = false;
        let isPlaying = false; // Para saber si el DJ ya arrancó

        // Función para añadir canción manual desde el Dashboard
        async function addManual() {
            const query = document.getElementById('manual-search').value;
            if (query) {
                await _supabase.from('playlist').insert([{ query: query, status: 'pending' }]);
                document.getElementById('manual-search').value = '';
            }
        }

        // Lógica de Pausa y ARRANQUE INICIAL
        async function togglePause() {
            const btn = document.getElementById('btn-pause');
            
            // Si el DJ no ha empezado a tocar nada, este clic fuerza el inicio
            if (!isPlaying && active === 1 && audio1.src === "") {
                console.log("▶️ Iniciando el motor del DJ por primera vez...");
                btn.innerText = "CARGANDO...";
                await checkAndPlayNext(); // Forzamos a que lea la cola
                btn.innerText = "PAUSA";
                return;
            }

            // Lógica normal de pausa
            isPaused = !isPaused;
            const currentPlayer = active === 1 ? audio1 : audio2;
            
            if (isPaused) {
                currentPlayer.pause();
                btn.innerText = "REANUDAR";
            } else {
                currentPlayer.play();
                btn.innerText = "PAUSA";
            }
            await _supabase.from('settings').update({ is_paused: isPaused }).eq('id', 1);
        }

        // Botón para saltar a la siguiente canción
        function skipTrack() {
            const currentPlayer = active === 1 ? audio1 : audio2;
            currentPlayer.currentTime = currentPlayer.duration - 5; // Salta al final para forzar el crossfade
        }

        // Refrescar la cola visualmente
        async function refreshQueue() {
            const { data } = await _supabase
                .from('playlist')
                .select('*')
                .order('created_at', { ascending: true });

            const list = document.getElementById('queue-list');
            list.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                div.innerHTML = `<strong>${item.title || item.query}</strong><br><span class="${item.status === 'playing' ? 'status-playing' : ''}">${item.status.toUpperCase()}</span>`;
                list.appendChild(div);
            });
        }

        // --- EL MOTOR DEL DJ ---
        async function checkAndPlayNext() {
            // Si ya está sonando algo y no está cerca de terminar, no hacemos nada
            const currentPlayer = active === 1 ? audio1 : audio2;
            const timeRemaining = currentPlayer.duration - currentPlayer.currentTime;
            
            // Si faltan menos de 8 segundos, o si no hay nada sonando, buscamos la siguiente
            if (!isPlaying || (currentPlayer.duration && timeRemaining <= 8)) {
                
                // Buscamos la canción más antigua en 'pending'
                const { data, error } = await _supabase
                    .from('playlist')
                    .select('*')
                    .eq('status', 'pending')
                    .order('created_at', { ascending: true })
                    .limit(1);

                if (data && data.length > 0) {
                    const track = data[0];
                    isPlaying = true;
                    
                    // Actualizamos la UI inmediatamente
                    document.getElementById('current-title').innerText = "Cargando: " + track.query + "...";
                    
                    // Marcamos como 'playing' en Supabase para no repetirla
                    await _supabase.from('playlist').update({ status: 'playing' }).eq('id', track.id);

                    try {
                        // Llama a tu API de Python local
                        const res = await fetch(`http://localhost:8000/get_audio?q=${encodeURIComponent(track.query)}`);
                        const trackInfo = await res.json();
                        
                        document.getElementById('current-title').innerText = trackInfo.title || track.query;
                        
                        // Guardamos el título real que encontró la IA en Supabase
                        await _supabase.from('playlist').update({ title: trackInfo.title }).eq('id', track.id);

                        startCrossfade(trackInfo.url);
                        
                    } catch (err) {
                        console.error("Error al obtener audio de Python:", err);
                        document.getElementById('current-title').innerText = "ERROR AL CARGAR";
                        // Si falla, la marcamos como error y el loop intentará con la siguiente
                        await _supabase.from('playlist').update({ status: 'error' }).eq('id', track.id);
                        isPlaying = false; 
                    }
                }
            }
        }

        function startCrossfade(url) {
            const nextPlayer = active === 1 ? audio2 : audio1;
            const currentPlayer = active === 1 ? audio1 : audio2;

            nextPlayer.src = url;
            nextPlayer.volume = 0;
            
            // Cuando la nueva canción esté lista para sonar
            nextPlayer.oncanplay = () => {
                nextPlayer.play();
                
                // Lógica de desvanecimiento (Crossfade)
                let vol = 0;
                const interval = setInterval(() => {
                    if (vol < 1) {
                        vol += 0.05;
                        nextPlayer.volume = Math.min(1, vol);
                        if (!currentPlayer.paused) {
                            currentPlayer.volume = Math.max(0, 1 - vol);
                        }
                    } else {
                        currentPlayer.pause();
                        currentPlayer.src = ""; // Limpiar memoria
                        active = active === 1 ? 2 : 1;
                        clearInterval(interval);
                    }
                }, 300); // Ajusta la velocidad del crossfade aquí
            };

            // Evento para saber cuándo la canción termina por completo
            nextPlayer.onended = () => {
                isPlaying = false;
            };
        }

        // Bucle principal: Actualiza la UI cada 2 segundos y chequea la música cada 2 segundos
        setInterval(refreshQueue, 2000);
        setInterval(checkAndPlayNext, 2000);
    </script>
</body>
</html>
