<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IA DJ Master Console</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
:root {
        --bg: #050507;
        --card-bg: #111116;
        --purple: #bc13fe;
        --turquoise: #00f2ff;
        --text: #ffffff;
        --gray: #444;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        display: grid;
        grid-template-columns: 1fr 380px;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    .main-panel {
        display: flex;
        flex-direction: column;
        padding: 20px;
        gap: 20px;
        height: 100%;
        box-sizing: border-box;
    }

    .decks-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        height: 350px; /* Altura fija para evitar el estiramiento infinito */
    }


    .deck.playing {
        border-color: var(--purple);
        box-shadow: 0 0 30px rgba(188, 19, 254, 0.2);
    }

    .deck {
        background: var(--card-bg);
        border: 2px solid #222;
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        overflow: hidden; /* Mantiene todo dentro de la caja */
    }

    .vinyl {
        width: 160px;
        height: 160px;
        min-width: 160px; /* Obliga al ancho exacto */
        min-height: 160px; /* Obliga a la altura exacta */
        flex-shrink: 0; /* EVITA EL ESTIRAMIENTO INFINITO */
        background: radial-gradient(circle, #222 0%, #000 70%);
        border-radius: 50%;
        border: 4px solid #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .vinyl::after {
        content: '';
        width: 35px;
        height: 35px;
        background: var(--purple);
        border-radius: 50%;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .playing .vinyl {
        animation: rotate 3s linear infinite;
        border-color: var(--turquoise);
    }

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .track-info { text-align: center; width: 100%; }
    .track-title { color: var(--turquoise); font-weight: bold; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .mixer-controls {
        background: #0f0f14;
        padding: 20px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        border: 1px solid #222;
    }

    .crossfader-container {
        width: 200px;
        height: 6px;
        background: #222;
        border-radius: 3px;
        position: relative;
    }

    .crossfader-knob {
        width: 35px;
        height: 20px;
        background: var(--turquoise);
        position: absolute;
        top: -7px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 3px;
        transition: left 0.5s ease;
    }

    /* Estilos de la Cola */
    .queue-panel { background: #0a0a0f; border-left: 1px solid #1a1a25; padding: 20px; overflow-y: auto; }
    .queue-item { background: #16161d; margin-bottom: 10px; padding: 12px; border-radius: 8px; border-left: 4px solid #333; cursor: pointer; }
    .queue-item.playing { border-left-color: var(--turquoise); background: #1a1a2a; }
    .queue-item.played { opacity: 0.5; border-left-color: #555; }
</style>

<body>
    <div class="main-panel">
        <div class="decks-container">
            <div id="deck-1" class="deck">
                <div class="track-status">Deck A</div>
                <div class="vinyl"></div>
                <div class="track-info">
                    <div id="title-1" class="track-title">Standby</div>
                </div>
            </div>

            <div id="deck-2" class="deck">
                <div class="track-status">Deck B</div>
                <div class="vinyl"></div>
                <div class="track-info">
                    <div id="title-2" class="track-title">Standby</div>
                </div>
            </div>
        </div>

        <div class="mixer-controls">
            <button class="pro-btn" onclick="togglePause()" id="btn-pause">PAUSE / PLAY</button>
            <div class="crossfader-container">
                <div id="fader-knob" class="crossfader-knob"></div>
            </div>
            <button class="pro-btn" style="border-color: var(--turquoise); color: var(--turquoise);" onclick="skipTrack()">NEXT SKIP</button>
        </div>

        <div class="search-box">
            <input type="text" id="manual-search" placeholder="Buscar canción manual en la base de datos...">
            <button class="pro-btn" onclick="addManual()">ADD QUEUE</button>
        </div>
    </div>

    <div class="queue-panel">
        <div class="queue-header">Playlist en vivo</div>
        <div id="queue-list"></div>
    </div>
</body>

    <script>

        const _supabase = supabase.createClient('https://krwojvaqdcmgqaposwco.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtyd29qdmFxZGNtZ3FhcG9zd2NvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODI4NTA2OCwiZXhwIjoyMDkzODYxMDY4fQ.IS3kMLP_UzDdTYat4ChTs9j-XJD7c9fB_bdjob4tfPM');

    
    let audio1 = new Audio();
    let audio2 = new Audio();
    let active = 1;
    let isPaused = false;
    let isPlaying = false; 
    let isFetchingNext = false;
    let currentTrackId = null;

    function updateDeckVisuals() {
        const d1 = document.getElementById('deck-1');
        const d2 = document.getElementById('deck-2');
        const knob = document.getElementById('fader-knob');
        if (active === 1) {
            d1.classList.add('playing'); d2.classList.remove('playing');
            knob.style.left = "20%"; 
        } else {
            d2.classList.add('playing'); d1.classList.add('playing');
            knob.style.left = "80%";
        }
    }

    async function addManual() {
        const query = document.getElementById('manual-search').value;
        if (query) {
            await _supabase.from('playlist').insert([{ query, status: 'pending' }]);
            document.getElementById('manual-search').value = '';
        }
    }

    async function replayTrack(query) {
        await _supabase.from('playlist').insert([{ query, status: 'pending' }]);
    }

    async function togglePause() {
        const btn = document.getElementById('btn-pause');
        if (!isPlaying && audio1.src === "" && audio2.src === "") {
            btn.innerText = "BUSCANDO...";
            await checkAndPlayNext();
            return;
        }
        isPaused = !isPaused;
        const current = active === 1 ? audio1 : audio2;
        isPaused ? current.pause() : current.play();
        btn.innerText = isPaused ? "REANUDAR" : "PAUSA / PLAY";
    }

    async function skipTrack() {
        const current = active === 1 ? audio1 : audio2;
        if(current.src) current.currentTime = current.duration - 2;
    }

    async function refreshQueue() {
        const { data } = await _supabase.from('playlist').select('*').order('created_at', { ascending: true });
        const list = document.getElementById('queue-list');
        list.innerHTML = '';
        
        let pending = data.filter(i => i.status === 'pending');
        let played = data.filter(i => i.status === 'played').map(i => i.title || i.query);

        data.forEach(item => {
            const div = document.createElement('div');
            div.className = `queue-item ${item.status}`;
            if(item.status === 'played') div.onclick = () => replayTrack(item.query);
            div.innerHTML = `<strong>${item.title || item.query}</strong><br><small>${item.status.toUpperCase()}</small>`;
            list.appendChild(div);
        });

        // AUTOPILOT: Si quedan menos de 2 en cola, pedimos refuerzos a la IA
        if (pending.length < 2 && data.length > 0 && !isFetchingNext) {
            const context = played.slice(-3).join(', ');
            fetch(`http://localhost:8000/get_recommendations?historial=${encodeURIComponent(context)}`)
                .then(r => r.json())
                .then(async res => {
                    for(let q of res.canciones) await _supabase.from('playlist').insert([{ query: q, status: 'pending' }]);
                });
        }
    }

    async function checkAndPlayNext() {
        if (isFetchingNext) return;
        const current = active === 1 ? audio1 : audio2;
        const remaining = current.duration - current.currentTime;

        if (!isPlaying || (current.duration && remaining <= 10)) {
            const { data } = await _supabase.from('playlist').select('*').eq('status', 'pending').order('created_at', { ascending: true }).limit(1);

            if (data && data.length > 0) {
                isFetchingNext = true;
                const track = data[0];
                const isFirst = (audio1.src === "" && audio2.src === "");
                const targetTitle = isFirst ? 'title-1' : (active === 1 ? 'title-2' : 'title-1');

                document.getElementById(targetTitle).innerText = "IA PREPARANDO...";
                await _supabase.from('playlist').update({ status: 'playing' }).eq('id', track.id);

                try {
                    const res = await fetch(`http://localhost:8000/get_audio?q=${encodeURIComponent(track.query)}`);
                    const info = await res.json();
                    document.getElementById(targetTitle).innerText = info.title;
                    await _supabase.from('playlist').update({ title: info.title }).eq('id', track.id);
                    startCrossfade(info.url, isFirst, track.id);
                } catch (e) {
                    await _supabase.from('playlist').update({ status: 'error' }).eq('id', track.id);
                }
                isFetchingNext = false;
            }
        }
    }

    function startCrossfade(url, isFirst, trackId) {
        let next = isFirst ? audio1 : (active === 1 ? audio2 : audio1);
        let prev = isFirst ? audio2 : (active === 1 ? audio1 : audio2);
        next.src = url;
        next.volume = 0;
        next.oncanplay = () => {
            next.play().then(async () => {
                isPlaying = true;
                active = isFirst ? 1 : (active === 1 ? 2 : 1);
                updateDeckVisuals();
                let v = 0;
                const itv = setInterval(async () => {
                    if (v < 1) {
                        v += 0.05;
                        next.volume = Math.min(1, v);
                        if (!isFirst) prev.volume = Math.max(0, 1 - v);
                    } else {
                        if(!isFirst) {
                            prev.pause();
                            await _supabase.from('playlist').update({ status: 'played' }).eq('status', 'playing').neq('id', trackId);
                        }
                        clearInterval(itv);
                    }
                }, 200);
            });
        };
        next.onended = () => { isPlaying = false; };
    }

    setInterval(refreshQueue, 3000);
    setInterval(checkAndPlayNext, 3000);
    </script>
</body>
</html>
